# markdownlint-cli2 config for coherence-cli.
# markdownlint-cli2 stops walking at the git root, so a per-user global config
# in the home directory isn't picked up from inside the repo.
# Mirrors the guildmaster / steward / teken preset for workspace consistency.

config:
  default: true
  # MD013: Line length — disabled. Prose lines wrap at the reader.
  MD013: false
  # MD060: Table pipe spacing — disabled (stylistic preference).
  MD060: false
  # MD024: Duplicate headings — allow under different parents so Keep a
  # Changelog entries can each have ### Added / ### Changed / ### Fixed.
  MD024:
    siblings_only: true

ignores:
  - "node_modules/**"
  # The virtualenv holds third-party package LICENSE.md files (numpy, httpx, …)
  # that trip markdownlint; it is created by `uv sync` in CI. Never our source.
  - ".venv/**"
  - ".local/**"
  - ".afi/**"
  - ".teken/**"
  # Vendored skills are cited verbatim from guildmaster — do not reformat them.
  - ".claude/skills/**"
  # devague exports (specs/plans) are generated artifacts — placeholders like
  # <file> trip MD033; the frame JSON is the source, don't hand-edit exports.
  - "docs/specs/**"
  - "docs/plans/**"
  # devague working state (reviews are gitignored; frames may embed raw text).
  - ".devague/**"
